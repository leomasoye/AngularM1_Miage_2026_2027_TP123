@if (auth.isLoggedIn()) {
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <a routerLink="/" class="brand-title">From Zero</a>
      </div>
      
      <div class="nav-links">
        <a routerLink="/tracks" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">library_music</span>
          Bibliothèque
        </a>
        <a routerLink="/activity" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">rss_feed</span>
          Activité
        </a>
        <a routerLink="/search" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">search</span>
          Rechercher
        </a>
        <a routerLink="/friends" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">group</span>
          <span style="flex: 1;">Amis</span>
          @if (pendingCount() > 0) {
            <span class="pending-badge">{{ pendingCount() }}</span>
          }
        </a>
        <a routerLink="/profile" routerLinkActive="active" class="nav-item">
          @if (auth.currentUser(); as user) {
            <app-avatar [user]="user" size="sm"></app-avatar>
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ user.name }}</span>
          } @else {
            <span class="material-symbols-outlined">account_circle</span>
            <span>Profil</span>
          }
        </a>
      </div>

      <div class="spacer"></div>

      <button type="button" class="btn-nav-logout nav-item" (click)="logout()">
        <span class="material-symbols-outlined">logout</span>
        Déconnexion
      </button>
    </aside>

    <main class="content-area">
      <router-outlet />
    </main>
  </div>
} @else {
  <main class="public-area">
    <router-outlet />
  </main>
}

<!-- Lecteur audio persistant Web Audio API (Étape 5) -->
<app-player-bar />
