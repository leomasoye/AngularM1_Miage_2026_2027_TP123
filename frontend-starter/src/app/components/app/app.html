@if (auth.isLoggedIn()) {
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <a routerLink="/" class="brand-title">From Zero</a>
      </div>
      
      <div class="nav-links">
        <a routerLink="/tracks" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">library_music</span>
          Bibliothèque
        </a>
        <a routerLink="/search" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">search</span>
          Rechercher
        </a>
        <a routerLink="/friends" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">group</span>
          Amis
        </a>
        <a routerLink="/profile" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">account_circle</span>
          Profil @if (auth.currentUser(); as user) { ({{ user.name }}) }
        </a>
      </div>

      <div class="spacer"></div>

      <button type="button" class="btn-nav-logout nav-item" (click)="logout()">
        <span class="material-symbols-outlined">logout</span>
        Déconnexion
      </button>
    </aside>

    <main class="content-area">
      <router-outlet />
    </main>
  </div>
} @else {
  <main class="public-area">
    <router-outlet />
  </main>
}

<!-- Placeholder pour le player-bar (sera implémenté plus tard) -->
<div id="player-portal"></div>
