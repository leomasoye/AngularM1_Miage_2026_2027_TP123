@if (player.currentTrack(); as track) {
  <div class="player-bar glass-elevated">
    <!-- Section Gauche : Métadonnées de la piste -->
    <div class="track-info">
      <div class="track-cover" [class.spinning]="player.isPlaying()">
        <mat-icon>music_note</mat-icon>
      </div>
      <div class="track-meta">
        <span class="track-title" [title]="track.title">{{ track.title }}</span>
        <span class="track-artist">{{ track.ownerName || 'Piste audio' }}</span>
      </div>
      <app-like-button [track]="track"></app-like-button>
    </div>

    <!-- Section Centrale : Contrôles & Barre de progression -->
    <div class="player-center">
      <div class="player-controls">
        <button
          mat-icon-button
          class="btn-control-secondary"
          (click)="rewind()"
          title="Reculer de 5s"
        >
          <mat-icon>replay_5</mat-icon>
        </button>

        <button
          mat-icon-button
          class="btn-play-pause"
          (click)="player.togglePlay()"
          [title]="player.isPlaying() ? 'Pause' : 'Lecture'"
        >
          @if (player.isLoading()) {
            <mat-spinner diameter="24"></mat-spinner>
          } @else {
            <mat-icon class="play-icon">
              {{ player.isPlaying() ? 'pause' : 'play_arrow' }}
            </mat-icon>
          }
        </button>

        <button
          mat-icon-button
          class="btn-control-secondary"
          (click)="forward()"
          title="Avancer de 5s"
        >
          <mat-icon>forward_5</mat-icon>
        </button>
      </div>

      <div class="timeline">
        <span class="time-label">{{ player.formattedCurrentTime() }}</span>
        <div class="slider-wrapper">
          <input
            type="range"
            class="progress-slider"
            min="0"
            max="100"
            step="0.1"
            [value]="player.progress()"
            (input)="onProgressInput($event)"
            (change)="onProgressChange($event)"
          />
          <div class="progress-fill" [style.width.%]="player.progress()"></div>
        </div>
        <span class="time-label">{{ player.formattedDuration() }}</span>
      </div>
    </div>

    <!-- Section Droite : VU/Visualiseur & Volume -->
    <div class="player-right">
      <div class="visualizer-wrapper" title="Spectre audio temps réel">
        <canvas #visualizerCanvas width="90" height="28"></canvas>
      </div>

      <div class="volume-control">
        <button
          mat-icon-button
          class="btn-volume"
          (click)="player.toggleMute()"
          [title]="player.isMuted() ? 'Rétablir le son' : 'Couper le son'"
        >
          <mat-icon>
            @if (player.isMuted() || player.volume() === 0) {
              volume_off
            } @else if (player.volume() < 0.5) {
              volume_down
            } @else {
              volume_up
            }
          </mat-icon>
        </button>

        <div class="volume-slider-wrapper">
          <input
            type="range"
            class="volume-slider"
            min="0"
            max="100"
            [value]="player.volume() * 100"
            (input)="onVolumeChange($event)"
          />
        </div>
      </div>
    </div>
  </div>
}
