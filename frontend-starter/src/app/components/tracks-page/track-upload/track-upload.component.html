<article class="glass-card" style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
  <h2 class="text-heading" style="margin: 0">Nouvelle piste</h2>
  
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Titre de la piste</mat-label>
    <input matInput type="text" [formControl]="title" placeholder="Ex: Solo Hotel California" />
  </mat-form-field>

  <div class="file-upload-wrapper" style="position: relative; border: 2px dashed var(--border-subtle); border-radius: var(--radius-sm); padding: 2rem; text-align: center; transition: all var(--transition-fast);">
    <mat-icon style="font-size: 32px; width: 32px; height: 32px; color: var(--orchid-300); margin-bottom: 0.5rem;">cloud_upload</mat-icon>
    <p class="text-body" style="margin: 0 0 1rem 0; color: var(--text-secondary);">Glissez un fichier audio ici ou cliquez pour parcourir</p>
    <input type="file" accept="audio/*" (change)="choose.emit($event)" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;" />
  </div>

  @if (uploading) {
    <div style="margin-top: 1rem;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
        <span class="text-small text-secondary">Envoi en cours...</span>
        <span class="text-small" style="color: var(--orchid-300); font-weight: bold;">{{ uploadProgress }}%</span>
      </div>
      <mat-progress-bar mode="determinate" [value]="uploadProgress" color="primary"></mat-progress-bar>
    </div>
  }

  @if (uploadError) {
    <div class="alert-error" role="alert" style="background: rgba(255,82,82,0.1); border: 1px solid #ff5252; padding: 1rem; border-radius: var(--radius-sm); color: #ff5252; margin-top: 1rem;">
      {{ uploadError }}
    </div>
  }

  @if (uploadSuccess) {
    <div class="alert-success" role="alert" style="background: rgba(76,175,80,0.1); border: 1px solid #4caf50; padding: 1rem; border-radius: var(--radius-sm); color: #4caf50; margin-top: 1rem;">
      {{ uploadSuccess }}
    </div>
  }

  <button mat-flat-button class="btn-primary" (click)="upload.emit()" [disabled]="uploading" style="margin-top: 1rem; width: 100%;">
    <mat-icon>upload</mat-icon>
    Importer la piste
  </button>
</article>
